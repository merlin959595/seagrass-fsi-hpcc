name: Validate ALE 96764 repair harness
on:
  push:
    branches:
      - fix/ale-concave-96764-20261122
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test harness with synthetic OpenFOAM file snippets
        run: |
          set -euo pipefail
          python3 -m py_compile hpcc/ale-repair-96764/repair96764.py hpcc/ale-repair-96764/test_repair96764.py
          python3 hpcc/ale-repair-96764/test_repair96764.py -v
      - name: Check frozen bootstrap, source pinning and bash syntax
        run: |
          set -euo pipefail
          bash -n hpcc/ale-repair-96764/bootstrap-96764.sh
          bash -n hpcc/ale-repair-96764/bootstrap-96764-v2.sh
          bash -n hpcc/ale-repair-96764/bootstrap-96764-v3.sh
          bash -n hpcc/ale-repair-96764/bootstrap-96764-v4.sh
          bash -n hpcc/ale-repair-96764/bootstrap-96764-v5.sh
          bash -n hpcc/ale-repair-96764/run-96764-container.sh
          test "$(git hash-object hpcc/ale-repair-96764/repair96764.py)" = "bc8c4decb24cf3b94a017f7149a2080bf7570929"
          test "$(git hash-object hpcc/clean-production/segment.py)" = "15a219c75a7e417d707549c2a0e46bbebd761d19"
          grep -Fq "bc8c4decb24cf3b94a017f7149a2080bf7570929" hpcc/ale-repair-96764/bootstrap-96764-v5.sh
          test "$(git hash-object hpcc/ale-repair-96764/run-96764-container.sh)" = "ceab0d1daccb3624bcaff44ec27d7caff0b19764"
          grep -Fq "ceab0d1daccb3624bcaff44ec27d7caff0b19764" hpcc/ale-repair-96764/bootstrap-96764-v5.sh
      - name: Check script does not execute HPCC when imported
        run: |
          python3 hpcc/ale-repair-96764/repair96764.py --help
