name: Cross-job restart safety (offline)
on:
  push:
    branches:
      - fix/our-crossjob-restart-20261116
  workflow_dispatch:
jobs:
  script-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n hpcc/clean-production/submit.sh hpcc/clean-production/compute.sh hpcc/restart-forensics/submit-our-restart-2window-20261116.sh hpcc/restart-forensics/submit-false-disp-only-ab-2window.sh hpcc/restart-forensics/submit-incremental-displacement-2window.sh
      - name: Python syntax
        run: python3 -m py_compile hpcc/clean-production/segment.py hpcc/clean-production/test-submit-mock.py hpcc/restart-forensics/try-aligned-reference-and-both-initial.py hpcc/restart-forensics/audit-91767-continuity-readonly.py
      - name: Restart quality policy unit tests
        run: python3 hpcc/clean-production/segment.py --self-test
      - name: Two-window candidate inputs self-test
        run: python3 hpcc/restart-forensics/try-aligned-reference-and-both-initial.py --self-test
      - name: Force-init single-variable candidate self-test
        run: |
          python3 -m py_compile hpcc/restart-forensics/try-reference-false-displacement-only.py
          python3 hpcc/restart-forensics/try-reference-false-displacement-only.py --self-test
      - name: Incremental-displacement cross-job startup (offline self-test)
        run: |
          python3 -m py_compile hpcc/restart-forensics/try-incremental-displacement-restart.py
          python3 hpcc/restart-forensics/try-incremental-displacement-restart.py --self-test
      - name: Reusable delta continuation offline test and runner shell checks
        run: |
          python3 -m py_compile hpcc/restart-forensics/delta-continuation.py
          python3 hpcc/restart-forensics/delta-continuation.py --self-test
          bash -n hpcc/restart-forensics/submit-delta-continuation-short.sh hpcc/restart-forensics/run-delta-continuation-container.sh hpcc/restart-forensics/prepare-g1-after-92264-readonly.sh
          test -z "$(grep -E '^[[:space:]]*sbatch([[:space:]]|$)' hpcc/restart-forensics/prepare-g1-after-92264-readonly.sh)"
          python3 - <<'PY_PIN'
          from pathlib import Path
          p=Path("hpcc/restart-forensics/submit-delta-continuation-short.sh").read_text()
          assert 'result="$OUTROOT/$name-$(echo "$hash"|cut -c1-16).${src##*.}"' in p
          assert '"$FSI_DELTA_SOURCE_WORK"' not in p  # source read through parent path
          assert 'if [[ "$ACTION" = "--preflight" ]]' in p
          assert "NO_AUTO_CHAIN_NO_LONG_PRODUCTION" in p
          PY_PIN
      - name: G1 read-only native audit and diagnostic G2 test
        run: |
          python3 -m py_compile hpcc/restart-forensics/audit-g1-92479-for-g2.py
          python3 hpcc/restart-forensics/audit-g1-92479-for-g2.py --self-test
          python3 hpcc/restart-forensics/delta-continuation.py --self-test
          bash -n hpcc/restart-forensics/submit-delta-continuation-short.sh hpcc/restart-forensics/run-delta-continuation-container.sh
          python3 - <<'PY_DIAG'
          from pathlib import Path
          d=Path("hpcc/restart-forensics/delta-continuation.py").read_text()
          b=Path("hpcc/restart-forensics/submit-delta-continuation-short.sh").read_text()
          r=Path("hpcc/restart-forensics/run-delta-continuation-container.sh").read_text()
          assert "DIAGNOSTIC_G2_ONLY_PERMITTED_FROM_G1_92479" in d
          assert "G2_DIAGNOSTIC_BOUNDED_PASS_NOT_PRODUCTION" in d
          assert "G2_EXPERIMENT_CANNOT_BECOME_LONG_PRODUCTION" in d
          assert "require-g2-eligible" in b
          assert "FSI_G2_DIAGNOSTIC" in b
          assert "G2_DIAGNOSTIC" in r
          print("G2_DIAGNOSTIC_SAFETY_GATES_OFFLINE_PASS")
          PY_DIAG
      - name: Read-only available ALE snapshot audit self-test
        run: |
          python3 -m py_compile hpcc/restart-forensics/audit-91878-available-ale-snapshots-readonly.py
          python3 hpcc/restart-forensics/audit-91878-available-ale-snapshots-readonly.py --self-test
      - name: Read-only ALE mesh point step forensic self-test
        run: |
          python3 -m py_compile hpcc/restart-forensics/audit-91878-ale-point-step-readonly.py
          python3 hpcc/restart-forensics/audit-91878-ale-point-step-readonly.py --self-test
          python3 hpcc/clean-production/audit-binary-ale-coordinates.py --self-test
      - name: Historical initialization control (no new FSI run)
        run: |
          python3 -m py_compile hpcc/restart-forensics/audit-historical-initialization-controls-readonly.py
          python3 hpcc/restart-forensics/audit-historical-initialization-controls-readonly.py --self-test
      - name: Differential pressure-solver trace audit
        run: |
          python3 -m py_compile hpcc/restart-forensics/audit-91819-continuous-vs-restart-first-pressure-readonly.py
          python3 hpcc/restart-forensics/audit-91819-continuous-vs-restart-first-pressure-readonly.py --self-test
      - name: Cross-job accepted displacement and force audit
        run: |
          python3 -m py_compile hpcc/restart-forensics/audit-91819-accepted-displacement-pressure-readonly.py
          python3 hpcc/restart-forensics/audit-91819-accepted-displacement-pressure-readonly.py --self-test
      - name: Native restart state audit parser self-test
        run: |
          python3 -m py_compile hpcc/restart-forensics/audit-91819-native-state-readonly.py
          python3 hpcc/restart-forensics/audit-91819-native-state-readonly.py --self-test
      - name: Differential force audit parser self-test
        run: python3 hpcc/restart-forensics/audit-91767-continuity-readonly.py --self-test
      - name: Guard against leaking Python argv to OpenFOAM bashrc
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('hpcc/restart-forensics/submit-our-restart-2window-20261116.sh').read_text()
          assert s.index('FSI_TEST_SCRIPT="$1"') < s.index('set --') < s.index('source /usr/lib/openfoam/openfoam2512/etc/bashrc')
          assert 'python3 "$FSI_TEST_SCRIPT" --base' in s
          assert 'export FSI_ISOLATED_CORE="$FSI_TEST_CORE"' in s
          assert 'export FSI_ISOLATED_HELPER_DIR="$FSI_TEST_HELPERS"' in s
          assert 'FSI_INITIAL_HELPER1_HASH=$H1' in s
          assert 'FSI_INITIAL_HELPER2_HASH=$H2' in s
          print('BASHRC_POSITIONAL_ARGUMENT_ISOLATION_PASS')
          PY
      - name: Mocked Slurm submission regression
        run: python3 hpcc/clean-production/test-submit-mock.py
 in r
          assert 'NEVER_AUTO_QUEUE_NEXT_STAGE' in d
          print('G2_DIAGNOSTIC_SAFETY_GATES_OFFLINE_PASS')
          PY_DIAG
      - name: Read-only available ALE snapshot audit self-test
        run: |
          python3 -m py_compile hpcc/restart-forensics/audit-91878-available-ale-snapshots-readonly.py
          python3 hpcc/restart-forensics/audit-91878-available-ale-snapshots-readonly.py --self-test
      - name: Read-only ALE mesh point step forensic self-test
        run: |
          python3 -m py_compile hpcc/restart-forensics/audit-91878-ale-point-step-readonly.py
          python3 hpcc/restart-forensics/audit-91878-ale-point-step-readonly.py --self-test
          python3 hpcc/clean-production/audit-binary-ale-coordinates.py --self-test
      - name: Historical initialization control (no new FSI run)
        run: |
          python3 -m py_compile hpcc/restart-forensics/audit-historical-initialization-controls-readonly.py
          python3 hpcc/restart-forensics/audit-historical-initialization-controls-readonly.py --self-test
      - name: Differential pressure-solver trace audit
        run: |
          python3 -m py_compile hpcc/restart-forensics/audit-91819-continuous-vs-restart-first-pressure-readonly.py
          python3 hpcc/restart-forensics/audit-91819-continuous-vs-restart-first-pressure-readonly.py --self-test
      - name: Cross-job accepted displacement and force audit
        run: |
          python3 -m py_compile hpcc/restart-forensics/audit-91819-accepted-displacement-pressure-readonly.py
          python3 hpcc/restart-forensics/audit-91819-accepted-displacement-pressure-readonly.py --self-test
      - name: Native restart state audit parser self-test
        run: |
          python3 -m py_compile hpcc/restart-forensics/audit-91819-native-state-readonly.py
          python3 hpcc/restart-forensics/audit-91819-native-state-readonly.py --self-test
      - name: Differential force audit parser self-test
        run: python3 hpcc/restart-forensics/audit-91767-continuity-readonly.py --self-test
      - name: Guard against leaking Python argv to OpenFOAM bashrc
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('hpcc/restart-forensics/submit-our-restart-2window-20261116.sh').read_text()
          assert s.index('FSI_TEST_SCRIPT="$1"') < s.index('set --') < s.index('source /usr/lib/openfoam/openfoam2512/etc/bashrc')
          assert 'python3 "$FSI_TEST_SCRIPT" --base' in s
          assert 'export FSI_ISOLATED_CORE="$FSI_TEST_CORE"' in s
          assert 'export FSI_ISOLATED_HELPER_DIR="$FSI_TEST_HELPERS"' in s
          assert 'FSI_INITIAL_HELPER1_HASH=$H1' in s
          assert 'FSI_INITIAL_HELPER2_HASH=$H2' in s
          print('BASHRC_POSITIONAL_ARGUMENT_ISOLATION_PASS')
          PY
      - name: Mocked Slurm submission regression
        run: python3 hpcc/clean-production/test-submit-mock.py
