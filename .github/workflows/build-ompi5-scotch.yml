name: Build FSI MPI5 Scotch-fixed candidate

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, test decomposePar and publish candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.ompi5-scotch
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/${{ github.repository }}:ompi5.0.7-precice3.4.1-scotch-candidate
